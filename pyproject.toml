[project]
name = "attention-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BluberryPie", email = "blub3rrypie@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.0.1",
    "pyyaml>=6.0.3",
    "rouge-score>=0.1.2",
    "torch>=2.13.0",
]

[project.scripts]
attention-lab = "attention_lab:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
# PLR0402 wants `from torch import nn` over `import torch.nn as nn`
# but the latter is the standard idion across the PyTorch ecosystem.
ignore = ["PLR0402"]
